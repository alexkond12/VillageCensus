// =====================================================================================
//  :neoforge — NeoForge entry point and NeoForge-specific glue (registration, events).
// =====================================================================================
plugins {
    id 'villagecensus.loader-conventions'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()}"
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) { attributes { attribute(loaderAttribute, 'neoforge') } }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.matching { it.name == variant }.configureEach { attributes { attribute(loaderAttribute, 'neoforge') } }
    }
}
