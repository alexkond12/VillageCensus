# Builds and tests every loader for every supported Minecraft version on each push / PR.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "26.1.2", "26.2", "26.3" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build (Minecraft ${{ matrix.mc }})
        run: ./gradlew build -Pmc_target=${{ matrix.mc }}
      - uses: actions/upload-artifact@v5
        with:
          name: villagecensus-mc${{ matrix.mc }}
          path: dist/*.jar
