# =====================================================================================
#  Village Census — project-wide properties
#  Minecraft/loader dependency versions live in versions/<mc_target>.properties
# =====================================================================================

# ---- Which Minecraft version to build against (override with -Pmc_target=...) ------
mc_target=26.3

# ---- Mod metadata (shared by every loader) ------------------------------------------
mod_id=villagecensus
mod_name=Village Census
mod_version=1.0.0
mod_group=io.github.alexkond12.villagecensus
mod_author=alexkond12
mod_license=MIT
mod_description=A ledger that tells you everything about the village around you: villagers, professions, free beds and workstations, breeding and iron golem readiness.
mod_homepage=https://github.com/alexkond12/VillageCensus
mod_issues=https://github.com/alexkond12/VillageCensus/issues
java_version=25

# ---- Gradle -------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# ForgeGradle 7: put classes and resources in one folder at dev time (required by Forge)
net.minecraftforge.gradle.merge-source-sets=true
