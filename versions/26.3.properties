# =====================================================================================
#  Dependency versions for Minecraft 26.3
#  Loaded by settings.gradle when building with -Pmc_target=26.3
# =====================================================================================

# Minecraft
minecraft_version=26.3
# Version ranges written into the loader metadata files
fabric_minecraft_range=>=26.3 <26.4-
mods_toml_minecraft_range=[26.3,26.4)

# Vanilla (used by the loader-independent 'common' project), https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, https://fabricmc.net/develop/
fabric_loader_version=0.20.1
fabric_api_version=0.165.0+26.3

# NeoForge, https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.99
neoforge_loader_range=[4,)

# Forge, https://files.minecraftforge.net/
forge_version=26.3-66.1.0
forge_loader_range=[66,)
# Resource/data pack format used in Forge's pack.mcmeta (copied from the Forge MDK of this version)
forge_pack_format=121
